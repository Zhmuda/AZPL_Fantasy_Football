# NOT CURRENTLY USED — the actual prod server runs this app alongside other
# projects behind a single host-level nginx (not dockerized), which already
# owns ports 80/443 and handles TLS via the host's certbot. See the
# azpl-fantasy nginx site config on that server instead; docker-compose.prod.yml
# no longer runs an nginx/certbot service. Kept here for a future move to a
# dedicated server, where this dockerized setup would apply again as-is.
#
# Production nginx config — HTTPS via Let's Encrypt/certbot.
#
# Ships with the 443 block commented out (below) because it points at a
# certificate that doesn't exist yet — nginx refuses to start otherwise.
#
# SETUP (do this once azpl-fantasy.duckdns.org actually resolves to this
# server's IP — check with `nslookup azpl-fantasy.duckdns.org`):
#   1. Start the stack as-is — port 80 only, redirecting to a 443 that isn't
#      live yet is fine, nothing serves real traffic during this step anyway:
#        docker compose -f docker-compose.prod.yml up -d nginx
#   2. Get the first certificate:
#        docker compose -f docker-compose.prod.yml run --rm certbot \
#          certonly --webroot -w /var/www/certbot -d azpl-fantasy.duckdns.org
#   3. Uncomment the entire 443 server block below, then restart nginx:
#        docker compose -f docker-compose.prod.yml restart nginx
#   Renewal is automatic after that — the certbot service in
#   docker-compose.prod.yml renews in the background and nginx just needs an
#   occasional reload to pick up the renewed cert (a weekly
#   `docker compose exec nginx nginx -s reload` cron entry is enough).

events {}

http {
    server {
        listen 80;
        server_name azpl-fantasy.duckdns.org;

        # Required for certbot's HTTP-01 challenge — must stay reachable over
        # plain HTTP even after HTTPS is otherwise enforced everywhere else.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

