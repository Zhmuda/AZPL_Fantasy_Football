services:

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # 1 worker, not 2 — this box has ~875MB total RAM shared with other
    # projects; each extra uvicorn worker is a full separate Python process.
    # --proxy-headers + --forwarded-allow-ips='*': this port is only reachable
    # from the host's own nginx (127.0.0.1-bound, see `ports` below), so it's
    # safe to trust X-Forwarded-* from anyone who can reach it. Without this,
    # uvicorn doesn't know the original request was HTTPS and builds redirect
    # URLs (e.g. after admin login) as http://, breaking the session cookie
    # round-trip.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips='*'
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      DEBUG: "false"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to localhost only — the host's own nginx (shared with other
    # projects on this box) reverse-proxies to this port. Not reachable
    # directly from the internet.
    ports:
      - "127.0.0.1:8001:8000"

  collector:
    build: ./collector
    # --pool=solo: no prefork children — with --concurrency=2 each concurrency
    # slot was a full forked Python process re-importing pandas/numpy (via
    # datafc), ~90MB apiece. This worker is I/O-bound (waiting on SofaScore
    # HTTP calls), not CPU-bound, so it doesn't need real parallelism —
    # solo runs everything in one process instead.
    command: celery -A celery_app worker --loglevel=warning -Q default --pool=solo
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: ./collector
    command: celery -A celery_app beat --loglevel=warning --schedule=/tmp/celerybeat-schedule
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    restart: unless-stopped
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # Same deal — the host's nginx proxies to this, not published publicly.
    ports:
      - "127.0.0.1:5174:80"

volumes:
  postgres_data:
